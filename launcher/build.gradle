plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group 'com.cosmical'
version '1.0.0'

repositories {
    mavenCentral()
    maven { url 'https://azure.com' }
}

dependencies {
    implementation 'fr.litarvan:openauth:1.1.2'
}

shadowJar {
    archiveClassifier.set('completo')
}
