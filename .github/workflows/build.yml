name: Compila Cosmical Launcher

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Scarica il codice di Cosmical
      uses: actions/checkout@v4

    - name: Configura Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Configura l'ambiente Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Compila il Launcher (.exe base)
      run: |
        cd launcher
        gradle jar

    - name: Invia il Launcher Pronto
      uses: actions/upload-artifact@v4
      with:
        name: Cosmical-Launcher-Pronto
        path: launcher/build/libs/*.jar
